{% include 'header.html' %}

     <div class="container-xxl py-5">
        <div class="container">
            <div class="text-center wow fadeInUp" data-wow-delay="0.1s">
                <h6 class="section-title bg-white text-center text-primary px-3">Files</h6>
                <h1 class="mb-5">ALL FILES</h1>
            </div>
            <div class="row g-4 justify-content-center">
            	{% for i in detail %}
                <div class="col-lg-4 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                    <div class="package-item">
                        <div class="overflow-hidden">
                            <img class="img-fluid" src="/media/{{i.image}}" alt="" style="width:100%;height: 250px;">
                        </div>
                        <div class="d-flex border-bottom">
                            <small class="flex-fill text-center border-end py-2"><i class="fa fa-file-alt text-primary me-2"></i>{{i.title}}</small>
                            <small class="flex-fill text-center border-end py-2"><i class="fa fa-list-alt text-primary me-2"></i>{{i.category}}</small>
                        </div>
                        <div class="text-center p-4">
                            
                          
                            <div class="d-flex justify-content-center mb-2">
                                <a href="{% url 'single_file' pk=i.id %}" class="btn btn-sm btn-primary px-3 border-end" style="border-radius: 30px 0 0 30px;">VIEW DETAIL</a>
                                
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
                
               </div> 
        </div>
    </div>

{% include 'footer.html' %}
