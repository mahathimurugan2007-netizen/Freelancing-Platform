{% include 'header.html' %}
{% load static %}
    
<div class="col-md-12 heading-section text-center ftco-animate fadeInUp ftco-animated" style="padding:30px 0 0 !important;">
	<span class="subheading">Files</span>
	<h2 class="mb-4">File Details</h2>
	
  </div>

	
	<section class="ftco-section">
    	<div class="container">
    		<div class="row">
			{% for i in detail %}
    			<div class="col-lg-6 mb-5 ftco-animate">
    				<video width="100%"  height="300px" controls>
                              <source src="/media/{{i.image}}" type="video/mp4">
                            
                            Your browser does not support the video tag.
                            </video>
    			</div>
    			<div class="col-lg-6 product-details pl-md-5 ftco-animate">
    				<h3>{{i.title}}</h3>
    				
						<p>Category Name: {{i.category}} </p>
					<h3>Description</h3>
					<p>{{i.description}}
						
    			</div>
				{% endfor %}
    		</div>
    	</div>
    </section>

{% include 'footer.html' %}
