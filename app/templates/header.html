<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>FREELANCING </title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<body style="background: url({% static 'img/12.jpg' %});">
    



    <!-- Navbar & Hero Start -->
    <div class="container-fluid position-relative p-0">
        <nav class="navbar navbar-expand-lg navbar-light px-4 px-lg-5 py-3 py-lg-0">
            <a href="" class="navbar-brand p-0">
                <h1 class="text-primary m-0"><i class="fa fa-map-marker-alt me-3"></i>FREELANCING</h1>
                <!-- <img src="img/logo.png" alt="Logo"> -->
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto py-0">
                    <a href="{% url 'home' %}" class="nav-item nav-link ">Home</a>
                     <a href="{% url 'search' %}" class="nav-item nav-link ">Search</a>
                     
                   <!-- <div class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Explore</a>
                        <div class="dropdown-menu m-0">
                            <a href="{% url 'all_learn_file' %}" class="dropdown-item">Learn</a>
                        </div>
                    </div>-->
                    
                </div>
                {% if request.session.username %}
                <a href="{% url 'user_dashboard' %}" class="btn btn-success rounded-pill py-2 px-4" style="margin-right: 10px;">Dashboard</a>
                 <a href="{% url 'logout' %}" class="btn btn-success rounded-pill py-2 px-4">Logout</a>
                 {% elif  request.session.editor  %}
                 <a href="{% url 'user_dashboard' %}" class="btn btn-success rounded-pill py-2 px-4" style="margin-right: 10px;s">Dashboard</a>
                 <a href="{% url 'editor_logout' %}" class="btn btn-success rounded-pill py-2 px-4">Logout</a>
                 {% else %}
                <a style="margin-right:15px;" href="{% url 'register' %}" class="btn btn-primary rounded-pill py-2 px-4">SignUp</a>
                 <a href="{% url 'user_login' %}" class="btn btn-success rounded-pill py-2 px-4">SignIn</a>
                 {% endif %}
            </div>
        </nav>
        <div class="container-fluid bg-primary py-5 mb-5 hero-header">
            <div class="container py-5">
                <div class="row justify-content-center py-5">
                    <div class="col-lg-10 pt-lg-5 mt-lg-5 text-center">
                        <h1 class="display-3 text-white mb-3 animated slideInDown">Search Your Jobs </h1>
                        
                        <div class="position-relative w-75 mx-auto animated slideInDown">
                            <form method="post" action="{% url 'search' %}">{% csrf_token %}
                            <input class="form-control border-0 rounded-pill w-100 py-3 ps-4 pe-5" type="text" name="search">
                            <button type="submit" class="btn btn-primary rounded-pill py-2 px-4 position-absolute top-0 end-0 me-2" style="margin-top: 7px;">Search</button>
                        </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
