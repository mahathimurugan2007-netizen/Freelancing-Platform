{% include 'user_header.html' %}
<div class="container" style="margin:10px auto;padding: 50px;background-color: #FFF;">
<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12" >
<div class="card">

    <div class="card-body">
        <div class="card-title">
            <h3 class=" title-2">CHAT NOW</h3>
        </div>
        {% for i in chat_id %}
            <div class="col-md-4" style="float:left;">
                <h3 style="font-size: 15px;">Name: {{i.name}}</h3>
            </div>
            <div class="col-md-6" style="float:left;">
                
                <p>{{i.question}}</p>
            </div>
            <div style="clear: both;">
        {% endfor %}
        {% if messages %}
            {% for i in messages %}
                <div class="alert alert-danger">{{i}}</div>
            {% endfor %}
        {% endif %}
       <form method="post">{% csrf_token %}
            <div class="form-group ">
                <label  class="control-label mb-1">Chat</label>
                <input type="text"  name="chat" class="form-control " required="required" > 
                
            </div>
            <div>
               <input type="submit"  value="SEND" class="btn btn-info " style="padding: 10px;font-size: 15px;">
            </div>
        </form><br><br><br>
       
    
    
    
</div>
</div>
</div></div>
