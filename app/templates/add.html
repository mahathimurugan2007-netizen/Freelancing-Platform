{%include 'user_header.html'%}
<div class="container" style="margin:10px auto;padding: 50px;background-color: #FFF;">
<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
    <div class="card">
        <h5 class="card-header">Add Files</h5>
        <div class="card-body">
            {% if messages %}
                {% for i in messages %}
                    <div class="alert alert-success">{{i}}</div>
                {% endfor %}
            {% endif %}
           <form  id="basicform" method="post" enctype="multipart/form-data">{% csrf_token %}
                <div class="form-group">
                    <label for="inputUserName">Title</label>
                    <input id="inputUserName" type="text" name="title" required="required"  class="form-control">
                </div>
                <div class="form-group">
                    <label for="inputUserName">Category</label>
                    <input id="inputUserName" type="text" name="category" required="required"  class="form-control">
                </div>
                <div class="form-group">
                    <label for="inputUserName">Price</label>
                    <input id="inputUserName" type="text" name="price" required="required"  class="form-control">
                </div>
                <div class="form-group">
                    <label for="inputUserName">Time Duration</label>
                    <input id="inputUserName" type="text" name="time" required="required"  class="form-control">
                </div>
                 <div class="form-group">
                    <label for="inputUserName">Project Start Date</label>
                    <input id="inputUserName" type="date" name="sdate" required="required"  class="form-control">
                </div>
                <div class="form-group">
                    <label for="inputUserName">Project End Date</label>
                    <input id="inputUserName" type="date" name="edate" required="required"  class="form-control">
                </div>
                 <div class="form-group">
                    <label for="inputUserName">Image</label>
                    <input id="inputUserName" type="file" name="img" required="required"  class="form-control">
                </div>
                <div class="form-group">
                    <label for="inputUserName">Project Type</label>
                
                    <select class="form-control" name="proj_type">
                        <option value="">Select</option>
                        <option value="Group Project">Group Project</option>
                        <option value="Individual Project">Individual Project</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inputUserName">Descrption</label>
                    <textarea name="description" class="form-control" required="required"></textarea>  
                </div>
                
                <div class="row">
                    <div class="col-sm-6 pl-0">
                    </div>
                    <div class="col-sm-6 pl-0">
                        <p class="text-right">
                            <button type="submit" class="btn btn-space btn-primary">Add File</button>
                            <button type="reset" class="btn btn-space btn-secondary">Cancel</button>
                        </p>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
</div>
