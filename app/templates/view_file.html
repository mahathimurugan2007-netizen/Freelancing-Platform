{%include 'user_header.html'%}
<div class="container" style="margin:10px auto;padding: 50px;background-color: #FFF;">
<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12" >
    <div class="card" >
        <h5 class="card-header">All File Details</h5>
        <div class="card-body">
            <div class="table-responsive ">
                <table class="table table-bordered">
                    <thead style="background:blue;color: #FFF">
                        <tr class="white">
                            <th scope="col" >S.No</th>
                            <th scope="col">Title</th>
                            <th scope="col">Category</th>
                            <th scope="col">File</th>
                            <th scope="col">Option</th>
                        </tr>
                    </thead>
                    <tbody >
                        {% for i in detail %}
                        <tr style="background:#FFF;color: #000">
                            <th scope="row">{{forloop.counter}}</th>
                            <td>{{i.title}}</td>
                            <td>{{i.category}}</td>
                            <td><a href="/media/{{i.image}}"><i class="fa fa-download" class="btn btn-info"></i></a></td>
                            <td> <a href="{% url 'delete' pk=i.id %}" class="btn btn-danger" style="background: red;"><i class="fa fa-trash"></i></a> <a href="{% url 'single_file' pk=i.id  %}" class="btn btn-info" target="_blank"><i class="fa fa-eye"></i></a></td>
                            
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="8" class="text-center bg-primary">No Files</td>
                        </tr>
                       {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>
